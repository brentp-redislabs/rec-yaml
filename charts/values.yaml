# Default values for redis-enterprise-cluster
redisEnterpriseCluster:
  # Name of the RedisEnterpriseCluster resource
  name: rec
  
  # Number of nodes in the cluster
  nodes: 1
  
  # Username for cluster access
  username: testuser@email.com
  
  # Name of the secret containing the Redis Enterprise license
  licenseSecretName: redislicense
  
  # Name of the secret for cluster credentials
  clusterCredentialSecretName: rec
  
  # Resource limits and requests for Redis Enterprise nodes
  resources:
    limits:
      cpu: "2"
      memory: "4Gi"
    requests:
      cpu: "2"
      memory: "4Gi"
  
  # Persistent storage configuration
  persistence:
    enabled: false

